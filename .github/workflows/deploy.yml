name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Keep qr.het68.cz fresh even when only qr_scrambler changes
  schedule:
    - cron: "0 */12 * * *"
  repository_dispatch:
    types: [qr_scrambler_updated]

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only this repo, and manual runs only from main — secrets never reach
    # forks or feature branches.
    if: >-
      github.repository == 'fedurca/het68_webflasher' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    # Scopes CLOUDFLARE_* secrets to this environment. In repo Settings →
    # Environments → production you can restrict deployment branches to `main`.
    environment:
      name: production
      url: https://het68.cz
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Fetch latest qr_scrambler
        run: npm run fetch:qr

      # wrangler-action runs `wrangler deploy` directly (npm predeploy is not
      # triggered), so stamp the build info explicitly before deploying.
      - name: Generate build info
        run: npm run build:info

      # Pinned to a full commit SHA (cloudflare/wrangler-action v3.15.0) for
      # supply-chain safety; bump deliberately when upgrading.
      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
