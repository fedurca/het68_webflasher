name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Keep qr.het68.cz fresh even when only qr_scrambler changes
  schedule:
    - cron: "0 */12 * * *"
  repository_dispatch:
    types: [qr_scrambler_updated]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Fetch latest qr_scrambler
        run: npm run fetch:qr

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
