name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Keep qr.het68.cz fresh even when only qr_scrambler changes
  schedule:
    - cron: "0 */12 * * *"
  repository_dispatch:
    types: [qr_scrambler_updated]

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only this repo, and manual runs only from main — secrets never reach
    # forks or feature branches.
    if: >-
      github.repository == 'fedurca/het68_webflasher' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    # Scopes CLOUDFLARE_* secrets to this environment. In repo Settings →
    # Environments → production you can restrict deployment branches to `main`.
    environment:
      name: production
      url: https://het68.cz
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Fetch latest qr_scrambler
        run: npm run fetch:qr

      - name: Generate build info
        run: npm run build:info

      # Do not use cloudflare/wrangler-action here: it runs `npm i` in the
      # workspace and npm 11 can crash. Same pattern as het68_spectral —
      # install wrangler into a throwaway prefix and invoke the binary.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm install --prefix /tmp/wrangler-cli wrangler@4.112.0
          /tmp/wrangler-cli/node_modules/.bin/wrangler deploy
