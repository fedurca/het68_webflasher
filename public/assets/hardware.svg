<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a222a"/>
      <stop offset="100%" stop-color="#0d1217"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0a0e12"/>
  <ellipse cx="320" cy="300" rx="220" ry="28" fill="#000" opacity="0.45"/>
  <g transform="translate(80,70)">
    <rect x="0" y="40" width="480" height="180" rx="18" fill="url(#body)" stroke="#2a3540"/>
    <rect x="0" y="40" width="480" height="180" rx="18" fill="url(#sheen)"/>
    <!-- ports -->
    <rect x="28" y="100" width="34" height="18" rx="3" fill="#0a0e12" stroke="#3a4652"/>
    <rect x="72" y="102" width="22" height="14" rx="2" fill="#0a0e12" stroke="#3a4652"/>
    <rect x="104" y="98" width="40" height="22" rx="4" fill="#0a0e12" stroke="#086821"/>
    <circle cx="420" cy="110" r="8" fill="#086821" opacity="0.9"/>
    <circle cx="448" cy="110" r="8" fill="#3b82f6" opacity="0.7"/>
    <!-- mic grid hint -->
    <g fill="#086821" opacity="0.35">
      <circle cx="200" cy="130" r="4"/><circle cx="230" cy="130" r="4"/><circle cx="260" cy="130" r="4"/>
      <circle cx="200" cy="160" r="4"/><circle cx="230" cy="160" r="4"/><circle cx="260" cy="160" r="4"/>
    </g>
    <text x="200" y="198" fill="#6b7a88" font-family="system-ui,sans-serif" font-size="14" font-weight="600">het68</text>
  </g>
