<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Pimoroni Pico Plus 2 W">
  <defs>
    <linearGradient id="pimpcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="1" stop-color="#161619"/>
    </linearGradient>
  </defs>
  <rect x="38" y="10" width="124" height="130" rx="12" fill="url(#pimpcb)" stroke="#3a3a42" stroke-width="1.5"/>
  <g fill="#e9b84a">
    <rect x="32" y="24" width="12" height="7" rx="2"/><rect x="32" y="37" width="12" height="7" rx="2"/>
    <rect x="32" y="50" width="12" height="7" rx="2"/><rect x="32" y="63" width="12" height="7" rx="2"/>
    <rect x="32" y="76" width="12" height="7" rx="2"/><rect x="32" y="89" width="12" height="7" rx="2"/>
    <rect x="32" y="102" width="12" height="7" rx="2"/><rect x="32" y="115" width="12" height="7" rx="2"/>
    <rect x="156" y="24" width="12" height="7" rx="2"/><rect x="156" y="37" width="12" height="7" rx="2"/>
    <rect x="156" y="50" width="12" height="7" rx="2"/><rect x="156" y="63" width="12" height="7" rx="2"/>
    <rect x="156" y="76" width="12" height="7" rx="2"/><rect x="156" y="89" width="12" height="7" rx="2"/>
    <rect x="156" y="102" width="12" height="7" rx="2"/><rect x="156" y="115" width="12" height="7" rx="2"/>
  </g>
  <!-- USB-C -->
  <rect x="80" y="3" width="40" height="16" rx="8" fill="#c9ccd1" stroke="#8b8f96" stroke-width="1"/>
  <rect x="87" y="8" width="26" height="6" rx="3" fill="#6b7078"/>
  <!-- MCU -->
  <rect x="76" y="40" width="48" height="36" rx="4" fill="#0c0c0f" stroke="#33333b"/>
  <text x="100" y="57" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="9" font-weight="800" fill="#e6b34c">RP2350</text>
  <text x="100" y="69" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="6" fill="#9aa0a8">Plus 2 W</text>
  <!-- PSRAM + flash chips -->
  <rect x="52" y="84" width="30" height="18" rx="2" fill="#0c0c0f" stroke="#33333b"/>
  <text x="67" y="96" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="5.5" fill="#9aa0a8">PSRAM</text>
  <rect x="118" y="84" width="30" height="18" rx="2" fill="#0c0c0f" stroke="#33333b"/>
  <text x="133" y="96" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="5.5" fill="#9aa0a8">16MB</text>
