  <rect x="74" y="106" width="52" height="18" rx="3" fill="#d8dbe0" stroke="#9aa0a8"/>
  <text x="100" y="118" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="6" font-weight="700" fill="#3a3f46">WiFi / BT</text>
  <!-- Meander PCB antenna -->
  <path d="M80 132 h5 v-5 h5 v5 h5 v-5 h5 v5 h5 v-5 h5 v5 h5" fill="none" stroke="#e9b84a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
