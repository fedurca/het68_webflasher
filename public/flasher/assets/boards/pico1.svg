<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Raspberry Pi Pico">
  <defs>
    <linearGradient id="p1pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12924a"/>
      <stop offset="1" stop-color="#0c7d3d"/>
    </linearGradient>
  </defs>
  <rect x="46" y="10" width="108" height="130" rx="12" fill="url(#p1pcb)" stroke="#0a5f2f" stroke-width="1.5"/>
  <!-- castellated pads -->
  <g fill="#e9b84a">
    <g>
      <rect x="40" y="24" width="12" height="7" rx="2"/><rect x="40" y="37" width="12" height="7" rx="2"/>
      <rect x="40" y="50" width="12" height="7" rx="2"/><rect x="40" y="63" width="12" height="7" rx="2"/>
      <rect x="40" y="76" width="12" height="7" rx="2"/><rect x="40" y="89" width="12" height="7" rx="2"/>
      <rect x="40" y="102" width="12" height="7" rx="2"/><rect x="40" y="115" width="12" height="7" rx="2"/>
    </g>
    <g>
      <rect x="148" y="24" width="12" height="7" rx="2"/><rect x="148" y="37" width="12" height="7" rx="2"/>
      <rect x="148" y="50" width="12" height="7" rx="2"/><rect x="148" y="63" width="12" height="7" rx="2"/>
      <rect x="148" y="76" width="12" height="7" rx="2"/><rect x="148" y="89" width="12" height="7" rx="2"/>
      <rect x="148" y="102" width="12" height="7" rx="2"/><rect x="148" y="115" width="12" height="7" rx="2"/>
    </g>
  </g>
  <!-- micro USB -->
  <rect x="82" y="4" width="36" height="16" rx="3" fill="#c9ccd1" stroke="#8b8f96" stroke-width="1"/>
  <rect x="88" y="8" width="24" height="8" rx="2" fill="#6b7078"/>
  <!-- BOOTSEL button -->
  <rect x="86" y="26" width="28" height="14" rx="3" fill="#f3f4f6" stroke="#b7bbc2"/>
  <text x="100" y="36" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="7" font-weight="700" fill="#3a3f46">BOOTSEL</text>
  <!-- MCU -->
  <rect x="74" y="62" width="52" height="40" rx="4" fill="#111418" stroke="#2a2f36"/>
  <text x="100" y="80" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="9" font-weight="800" fill="#dfe3e8">RP2040</text>
  <text x="100" y="93" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="6" fill="#8b939c">Pico</text>
  <!-- LED -->
  <circle cx="100" cy="120" r="4" fill="#3ad07a"/>
</svg>
