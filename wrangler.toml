# HET68 web flasher — Cloudflare Workers Static Assets
# Domain: het68.cz
name = "het68-webflasher"
main = "src/worker.js"
compatibility_date = "2026-07-19"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Bind custom domain after the zone is in the same Cloudflare account:
#   npx wrangler deploy
#   npx wrangler domains add het68.cz
# Or set routes below once DNS is on Cloudflare:
#
# [[routes]]
# pattern = "het68.cz/*"
# zone_name = "het68.cz"
#
# [[routes]]
# pattern = "www.het68.cz/*"
# zone_name = "het68.cz"

[vars]
FIRMWARE_REPO = "fedurca/het68"
