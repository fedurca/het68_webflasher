# het68.cz — marketing site + flasher.het68.cz
name = "het68-webflasher"
main = "src/worker.js"
compatibility_date = "2026-07-19"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# Worker must run first for Basic Auth + host-based flasher routing
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
FIRMWARE_REPO = "fedurca/het68"
# Optional override for the footer bypass token (defaults to the value compiled
# into src/worker.js). Prefer rotating the constant in worker.js + footers.
# AUTH_BYPASS_TOKEN = "…"

# Custom Domains (zóna het68.cz musí být na stejném Cloudflare účtu).
# Po úpravě stačí: npx wrangler deploy
#
# www.het68.cz stays as a custom domain so Cloudflare still terminates TLS and
# routes traffic here; the Worker issues 301 → https://het68.cz/... (DNS alone
# cannot rewrite the Host header / strip www).
[[routes]]
pattern = "het68.cz"
custom_domain = true

[[routes]]
pattern = "www.het68.cz"
custom_domain = true

[[routes]]
pattern = "flasher.het68.cz"
custom_domain = true

[[routes]]
pattern = "qr.het68.cz"
custom_domain = true

[[routes]]
pattern = "chirp.het68.cz"
custom_domain = true

[[routes]]
pattern = "dev.het68.cz"
custom_domain = true

[[routes]]
pattern = "api.het68.cz"
custom_domain = true

# Shared room for chirpdev — synchronizes tuning parameters and node presence
# across all visitors (Durable Object, SQLite-backed, created on first use).
[[durable_objects.bindings]]
name = "CONFIG_ROOM"
class_name = "ConfigRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConfigRoom"]
